version: 2
updates:
  # Besides uv.lock, the uv updater picks up every *.in / *.txt in the
  # directory: requirements-build.in/.txt (#331) and requirements-image.in/.txt
  # (#342). It pairs each .txt with its .in by name and re-runs the
  # `uv pip compile` in the .txt header, keeping --generate-hashes, so a bump
  # re-resolves the whole pinned set. A separate "pip" entry would run
  # pip-tools against the same files and open competing PRs.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5

  # The Dockerfile pins its base and tool images by digest, which is what makes
  # the build-provenance attestation mean anything -- and what makes them go
  # stale silently without something watching them.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
