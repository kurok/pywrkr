version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  # The hash-pinned requirements files: requirements-build.txt (the release
  # pipeline's build inputs, #331) and requirements-image.txt (the container
  # image's Python stack, #342). The uv ecosystem above watches uv.lock only,
  # so without this entry those pins never move. Each file's header has the
  # uv pip compile command that regenerates it.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5

  # The Dockerfile pins its base and tool images by digest, which is what makes
  # the build-provenance attestation mean anything -- and what makes them go
  # stale silently without something watching them.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
