name: Auto Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: version
      env:
        TAG_NAME: ${{ github.ref_name }}
      run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Verify version matches pyproject.toml
      env:
        TAG_VERSION: ${{ steps.version.outputs.version }}
      run: |
        PROJECT_VERSION=$(python -c "
        import re
        with open('pyproject.toml') as f:
            m = re.search(r'version\s*=\s*\"(.+?)\"', f.read())
            print(m.group(1))
        ")
        if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
          echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml ($PROJECT_VERSION)"
          exit 1
        fi

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        # requirements-build.txt is compiled for this version.
        python-version: "3.12"

    # pywrkr.__version__ is read from the installed package metadata (#149),
    # so installing the package alone -- pinned build backend, no isolation,
    # no dependencies -- is enough to check it, and nothing is resolved from
    # the index in a job that holds contents: write (#307).
    - name: Verify pywrkr.__version__ matches tag
      env:
        TAG_VERSION: ${{ steps.version.outputs.version }}
      run: |
        python -m pip install --quiet --require-hashes --no-deps -r requirements-build.txt
        python -m pip install --quiet --no-build-isolation --no-deps .
        RUNTIME_VERSION=$(python -c "from importlib.metadata import version; print(version('pywrkr'))")
        if [ "$RUNTIME_VERSION" != "$TAG_VERSION" ]; then
          echo "::error::pywrkr.__version__ ($RUNTIME_VERSION) != tag ($TAG_VERSION)"
          exit 1
        fi

    - name: Generate changelog from commits
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          RANGE="${PREV_TAG}..HEAD"
        else
          RANGE="HEAD"
        fi
        DELIM="CHANGELOG_$(uuidgen)"
        {
          echo "changelog<<$DELIM"
          git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges
          echo ""
          echo "$DELIM"
        } >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
      with:
        name: "v${{ steps.version.outputs.version }}"
        body: |
          ## What's Changed
          ${{ steps.changelog.outputs.changelog }}
        generate_release_notes: true
