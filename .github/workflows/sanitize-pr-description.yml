name: sanitize-pr-description

on:
  pull_request:
    types: [opened, edited, synchronize]

# Read-only by default; only the job below may edit the pull request, and it
# runs only for pull requests from this repository's own branches. A fork's
# pull request never gets a write-scoped token from this workflow (#308).
permissions:
  contents: read

jobs:
  clean-pr:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Clean PR description
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const signaturePatterns = [
              /Generated by Claude.*$/gim,
              /Co-authored-by: Claude.*$/gim,
              /🤖.*Claude.*$/gim
            ];

            let body = context.payload.pull_request.body;

            if (!body) return;

            let cleaned = body;
            for (const pattern of signaturePatterns) {
              cleaned = cleaned.replace(pattern, '');
            }

            if (cleaned !== body) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body: cleaned.trim()
              });
            }
