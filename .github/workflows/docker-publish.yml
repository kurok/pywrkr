name: Build and Push Docker Image

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docker-publish.yml"
      - ".github/scripts/check-image.sh"
  pull_request:
    paths:
      - "Dockerfile"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docker-publish.yml"
      - ".github/scripts/check-image.sh"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Read-only by default. The write scopes are granted only to the job that
# pushes, and that job never runs for a pull request, so a pull request's
# Dockerfile is never built while a write-scoped token is in reach -- whatever
# the repository's fork-token setting says (#308).
permissions:
  contents: read

jobs:
  # Pull requests: build the image and check it, with a read-only token.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: The image does not run as root and has a health check
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: .github/scripts/check-image.sh "$(echo "$IMAGE_TAGS" | head -n1)"

  # main and releases: build, push and attest.
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          push: true
          # Loaded into the local daemon as well, so the checks below run
          # against the image that was actually built.
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: The image does not run as root and has a health check
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: .github/scripts/check-image.sh "$(echo "$IMAGE_TAGS" | head -n1)"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@b3e506e8c389afc651c5bacf2b8f2a1ea0557215  # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
