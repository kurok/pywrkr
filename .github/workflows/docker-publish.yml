name: Build and Push Docker Image

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements-image.txt"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docker-publish.yml"
      - ".github/scripts/check-image.sh"
  pull_request:
    paths:
      - "Dockerfile"
      - "requirements-image.txt"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docker-publish.yml"
      - ".github/scripts/check-image.sh"
  # An agent (or a maintainer) can publish a build on demand, optionally under
  # an extra tag. The same tag set is produced for both registries.
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. 1.6.0, nightly). Empty = the usual semver/sha/latest set."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub, for the images agents pull. The username and token are
  # repository secrets; without them the Docker Hub steps are skipped and the
  # GitHub Container Registry publish still happens.
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE: docker.io/ryabikov/pywrkr

# Read-only by default. The write scopes are granted only to the job that
# pushes, and that job never runs for a pull request, so a pull request's
# Dockerfile is never built while a write-scoped token is in reach -- whatever
# the repository's fork-token setting says (#308).
permissions:
  contents: read

jobs:
  # Pull requests: build the image and check it, with a read-only token.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      # The image is published for linux/amd64 and linux/arm64 (#339). QEMU
      # runs the arm64 build steps on this amd64 runner; aiohttp and its C
      # extensions ship musllinux aarch64 wheels, so nothing is compiled. The
      # base image digest is a multi-platform index, so it covers both.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # A multi-platform image cannot be loaded into the daemon in one go, so
      # each platform is built and loaded on its own and checked before
      # anything is pushed. The builder keeps its cache between these steps.
      - name: Build Docker image (linux/amd64)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: pywrkr:check-amd64

      - name: Check the image (linux/amd64)
        run: .github/scripts/check-image.sh pywrkr:check-amd64

      - name: Build Docker image (linux/arm64)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: pywrkr:check-arm64

      - name: Check the image (linux/arm64)
        # Runs under QEMU; DOCKER_DEFAULT_PLATFORM makes every docker run in
        # the script ask for the arm64 variant instead of the runner's.
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: .github/scripts/check-image.sh pywrkr:check-arm64

  # main and releases: build, push and attest.
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      # A Docker Hub access token with Read & Write on the repository. Kept in
      # the environment rather than inlined, so the token never reaches a
      # command line in the job's logs.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # Skipped when the repository has no Docker Hub secrets, so a fork (or
        # a clone without them) still publishes to GitHub Container Registry.
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6
        with:
          # One metadata step, both registries: the tag set is identical, so a
          # tag that exists on GitHub Container Registry exists on Docker Hub.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # The optional extra tag is a step of its own rather than another entry in
      # the list above: metadata-action evaluates `enable=` with its own
      # expression parser, which does not understand GitHub's `${{ }}`
      # expressions. A plain `if:` on the step does.
      - name: Extract metadata (the extra tag, when one was given)
        id: meta-extra
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }}

      # The image is published for linux/amd64 and linux/arm64 (#339). QEMU
      # runs the arm64 build steps on this amd64 runner; aiohttp and its C
      # extensions ship musllinux aarch64 wheels, so nothing is compiled. The
      # base image digest is a multi-platform index, so it covers both.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # A multi-platform image cannot be loaded into the daemon in one go, so
      # each platform is built and loaded on its own and checked before
      # anything is pushed. The builder keeps its cache between these steps.
      - name: Build Docker image (linux/amd64)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: pywrkr:check-amd64

      - name: Check the image (linux/amd64)
        run: .github/scripts/check-image.sh pywrkr:check-amd64

      - name: Build Docker image (linux/arm64)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: pywrkr:check-arm64

      - name: Check the image (linux/arm64)
        # Runs under QEMU; DOCKER_DEFAULT_PLATFORM makes every docker run in
        # the script ask for the arm64 variant instead of the runner's.
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: .github/scripts/check-image.sh pywrkr:check-arm64

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          # One manifest list per tag, holding both platforms. The digest
          # output is the index's, which is what the attestation names.
          platforms: linux/amd64,linux/arm64
          push: true
          # An SPDX SBOM per platform, stored with the image, lists every
          # Python package installed from requirements-image.txt -- the build
          # provenance names only the base images (#342).
          sbom: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta-extra.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest build provenance
        # The attestation is stored as an OCI referrer next to the image, in
        # every registry the image was pushed to, and names every tag of both
        # registries -- so the Docker Hub image is attested as well.
        uses: actions/attest-build-provenance@b3e506e8c389afc651c5bacf2b8f2a1ea0557215  # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
