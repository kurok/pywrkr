name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "30 1 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          # python: this repo's source and tests. No build step: CodeQL's
          # python extractor works straight off the source, and current
          # codeql-action versions reject build-mode: autobuild for it.
          - python
          # actions: the workflow YAML under .github/workflows/ itself. This
          # replaces the "actions" language coverage that Default setup used
          # to provide before it was superseded by this workflow -- Default
          # setup and an Advanced-setup workflow can't cover the same
          # language at once, and its last scan (see the Code Scanning
          # "Tools" page) had gone stale since.
          - actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
